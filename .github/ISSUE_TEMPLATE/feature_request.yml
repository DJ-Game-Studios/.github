name: Feature request
description: Suggest a focused improvement to a maintained public project.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first. A clear use case is more useful than a broad redesign.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and what blocks you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the behavior you would like without prescribing unnecessary implementation details.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note any existing workaround or related approach you tried.
  - type: dropdown
    id: contribution
    attributes:
      label: Contribution
      description: Would you be interested in implementing this after the direction is approved?
      options:
        - "No"
        - "Yes"
        - "Maybe, with guidance"
    validations:
      required: true
